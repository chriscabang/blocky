name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:

  # ── 1. deps ──────────────────────────────────────────────────────────────
  # Install system packages and build liboqs (cached).
  # Bump the cache key suffix (v1 → v2) to force a full liboqs rebuild.
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build gcc

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../libs/liboqs
          key: liboqs-main-${{ runner.os }}-v1

      - name: Clone and build liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ github.workspace }}/../libs"
          git clone --depth 1 \
            https://github.com/open-quantum-safe/liboqs.git \
            "${{ github.workspace }}/../libs/liboqs"
          cmake -GNinja \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -S "${{ github.workspace }}/../libs/liboqs" \
            -B "${{ github.workspace }}/../libs/liboqs/build"
          ninja -C "${{ github.workspace }}/../libs/liboqs/build"

  # ── 2. build ─────────────────────────────────────────────────────────────
  # Compile release + debug binaries and all test binaries.
  # Uploads build/ as an artifact so the check job can reuse the binaries.
  build:
    needs: [deps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc libssl-dev libcmocka-dev

      - name: Restore liboqs cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../libs/liboqs
          key: liboqs-main-${{ runner.os }}-v1

      - name: Build (release + debug + utils + test binaries)
        run: make all test_bins

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

  # ── 3. check ─────────────────────────────────────────────────────────────
  # Runs the full test suite then rebuilds with --coverage and reports
  # line coverage. Uploads the HTML report as a downloadable artifact.
  check:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test and coverage dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc libssl-dev libcmocka-dev lcov

      - name: Restore liboqs cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../libs/liboqs
          key: liboqs-main-${{ runner.os }}-v1

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Mark build artifacts as executable and up-to-date
        run: |
          find build/ -type f | xargs touch
          chmod +x build/test_* build/utils/* build/zuno build/zuno-debug 2>/dev/null || true

      - name: Run test suite
        run: make test

      - name: Run coverage
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/cov/html/
          if-no-files-found: ignore
