name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# ── liboqs cache key ────────────────────────────────────────────────────────
# Shared across all three jobs. Bump the suffix (v1 → v2) to force a full
# liboqs rebuild (e.g. after a major upstream change).
env:
  LIBOQS_CACHE_KEY: liboqs-main-${{ runner.os }}-v1
  LIBOQS_PATH:      ${{ github.workspace }}/../libs/liboqs

jobs:

  # ── 1. deps ───────────────────────────────────────────────────────────────
  # Clones and builds liboqs once, then saves it to the Actions cache so the
  # build and check jobs can restore it without recompiling from scratch.
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake ninja-build gcc

      - name: Cache liboqs
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBOQS_PATH }}
          key:  ${{ env.LIBOQS_CACHE_KEY }}

      - name: Clone and build liboqs
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.LIBOQS_PATH }}/.."
          git clone --depth 1 \
            https://github.com/open-quantum-safe/liboqs.git \
            "${{ env.LIBOQS_PATH }}"
          cmake -GNinja \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -S "${{ env.LIBOQS_PATH }}" \
            -B "${{ env.LIBOQS_PATH }}/build"
          ninja -C "${{ env.LIBOQS_PATH }}/build"

  # ── 2. build ──────────────────────────────────────────────────────────────
  # Compiles all zuno targets (release, debug, utils, test binaries) and
  # uploads the build directory as an artifact for the check job.
  build:
    needs: [deps]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install compiler dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc cmake ninja-build libssl-dev libcmocka-dev

      - name: Restore liboqs cache
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBOQS_PATH }}
          key:  ${{ env.LIBOQS_CACHE_KEY }}

      - name: Build liboqs (fallback on cache miss)
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.LIBOQS_PATH }}/.."
          git clone --depth 1 \
            https://github.com/open-quantum-safe/liboqs.git \
            "${{ env.LIBOQS_PATH }}"
          cmake -GNinja \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -S "${{ env.LIBOQS_PATH }}" \
            -B "${{ env.LIBOQS_PATH }}/build"
          ninja -C "${{ env.LIBOQS_PATH }}/build"

      - name: Build (release + debug + utils + test binaries)
        run: make all test_bins

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

  # ── 3. check ──────────────────────────────────────────────────────────────
  # Downloads the pre-built binaries, runs the full test suite, then rebuilds
  # with --coverage and generates an lcov HTML report.
  check:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test and coverage dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc cmake ninja-build libssl-dev libcmocka-dev lcov

      - name: Restore liboqs cache
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ${{ env.LIBOQS_PATH }}
          key:  ${{ env.LIBOQS_CACHE_KEY }}

      - name: Build liboqs (fallback on cache miss)
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ env.LIBOQS_PATH }}/.."
          git clone --depth 1 \
            https://github.com/open-quantum-safe/liboqs.git \
            "${{ env.LIBOQS_PATH }}"
          cmake -GNinja \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -S "${{ env.LIBOQS_PATH }}" \
            -B "${{ env.LIBOQS_PATH }}/build"
          ninja -C "${{ env.LIBOQS_PATH }}/build"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Mark build artifacts as executable and up-to-date
        run: |
          find build/ -type f | xargs touch
          chmod +x build/test_* build/utils/* build/zuno build/zuno-debug 2>/dev/null || true

      - name: Run test suite
        run: make test

      - name: Run coverage
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: build/cov/html/
          if-no-files-found: ignore
